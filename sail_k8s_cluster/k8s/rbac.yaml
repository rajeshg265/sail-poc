apiVersion: v1
kind: ServiceAccount
metadata:
  name: sail-driver
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sail-driver-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "get", "list", "watch", "delete", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sail-driver-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: sail-driver
  namespace: default
roleRef:
  kind: Role
  name: sail-driver-role
  apiGroup: rbac.authorization.k8s.io
